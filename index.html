<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; background: white; color: black; word-break: break-all; }
  </style>
</head>
<body>
  <script>
    const laugh = 'ㅋ'.repeat(10000);
    function more() {
      document.body.append(document.createTextNode(laugh));
    }
    for (let i = 0; i < 5; i++) more();
    window.addEventListener('scroll', () => {
      if (window.innerHeight + window.scrollY > document.documentElement.scrollHeight - 1200) {
        more();
      }
    }, { passive: true });
  </script>
</body>
</html>
